<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Study</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#ffffff;
    --panel:#ffffff;
    --panel-2:#f3f6fb;
    --border:#dbe4f0;
    --text:#1c2a3a;
    --muted:#6b7a90;
    --blue:#2f6fed;
    --blue-dim:#2f6fed14;
    --red:#e0333f;
    --red-dim:#e0333f14;
    --good:#2fa86a;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 0 60px;
  }

  header{
    width:100%;
    padding:16px 20px;
    border-bottom:2px solid var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  header h1{
    margin:0;
    font-size:16px;
    font-weight:800;
    letter-spacing:0.2px;
  }
  header h1 .dot{ color:var(--red); }

  main{
    width:100%;
    max-width:440px;
    padding:24px 18px;
  }

  .hidden{ display:none !important; }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    box-shadow:0 2px 14px rgba(30,50,90,0.06);
  }

  .title{ font-size:18px; font-weight:800; margin:0 0 4px; }
  .sub{ font-size:13px; color:var(--muted); margin:0 0 18px; }

  /* ---- set / session lists ---- */
  .list{ display:flex; flex-direction:column; gap:10px; }
  .list-item{
    display:flex; align-items:center; gap:12px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    text-align:left;
  }
  .list-item:hover{ border-color:var(--blue); }
  .list-item:active{ background:var(--blue-dim); }
  .list-icon{
    flex:none;
    width:38px; height:38px;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
    background:#fff;
    border:1px solid var(--border);
  }
  .list-name{ font-size:14px; font-weight:700; }
  .list-meta{ font-size:12px; color:var(--muted); margin-top:1px; }

  .back-link{
    margin-top:16px;
    background:none; border:none;
    color:var(--blue); font-size:13px;
    text-align:left; cursor:pointer;
    padding:0;
    font-weight:600;
  }

  /* ---- buttons ---- */
  .btn{
    font-family:var(--sans);
    font-weight:700;
    font-size:14px;
    padding:11px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    cursor:pointer;
    width:100%;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .btn:hover{ border-color:var(--blue); }
  .btn:active{ background:var(--blue-dim); }
  .btn-primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    justify-content:center;
  }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-good{ background:var(--good); border-color:var(--good); color:#fff; justify-content:center; }
  .btn-bad{ background:var(--red); border-color:var(--red); color:#fff; justify-content:center; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ justify-content:center; }

  .speak-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px;
    margin-left:8px;
    font-size:13px;
    background:var(--blue-dim);
    border:1px solid var(--border);
    border-radius:50%;
    cursor:pointer;
    flex:none;
  }
  .speak-btn:active{ background:var(--blue-dim); filter:brightness(0.95); }

  /* ---- quiz card ---- */
  .quiz-card.shake{ animation:shake 300ms; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }

  .picture-slot{
    display:flex; align-items:center; justify-content:center;
    margin:2px 0 16px;
    min-height:150px;
  }
  .picture-slot img{
    width:150px; height:150px;
    object-fit:contain;
    border-radius:10px;
    background:#fff;
    border:1px solid var(--border);
  }
  .picture-slot.placeholder{ font-size:44px; color:var(--muted); }

  .prompt{
    font-size:15px; font-weight:700;
    text-align:center;
    margin:0 0 16px;
  }
  .prompt .target{ color:var(--blue); }

  .options{ display:flex; flex-direction:column; gap:10px; }

  .type-input{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
  }
  .type-input:focus{ outline:none; border-color:var(--blue); }

  /* ---- match / odd-one-out / connections grids ---- */
  .match-grid{ display:flex; gap:10px; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .chip{
    font-family:var(--sans);
    font-size:13px;
    padding:9px 10px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    cursor:pointer;
    text-align:left;
    display:flex; align-items:center; justify-content:space-between;
  }
  .chip.visual-chip{ font-size:22px; text-align:center; justify-content:center; }
  .chip.selected{ outline:2px solid var(--blue); }
  .chip.matched{ background:#e6f6ec; border-color:var(--good); opacity:0.75; cursor:default; }
  .chip.shake-chip{ animation:shake 300ms; background:var(--red-dim); }

  .oddoneout-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .oo-cell{
    font-family:var(--sans);
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    cursor:pointer;
    text-align:center;
  }
  .oo-cell:hover{ border-color:var(--blue); }
  .oo-img{ font-size:28px; margin-bottom:6px; }
  .oo-img img{ width:64px; height:64px; object-fit:contain; }
  .oo-label{ font-size:12px; font-weight:600; }

  .connections-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .conn-cell{
    font-family:var(--sans);
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 4px;
    cursor:pointer;
    text-align:center;
  }
  .conn-cell .oo-img{ font-size:18px; margin-bottom:3px; }
  .conn-cell .oo-img img{ width:40px; height:40px; object-fit:contain; }
  .conn-cell .oo-label{ font-size:10px; font-weight:600; }
  .conn-cell.selected{ outline:2px solid var(--blue); }
  .conn-cell.solved{ cursor:default; opacity:0.85; }

  /* ---- toast ---- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff;
    padding:10px 18px; border-radius:10px;
    font-size:13px; font-weight:600;
    opacity:0; pointer-events:none;
    transition:opacity 200ms;
    z-index:50;
    max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  .setup-note{ font-size:13px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>

<header><h1>Vocab Study<span class="dot">.</span></h1></header>

<main>
  <div id="selectScreen" class="card hidden">
    <div class="title">Choose a set</div>
    <div class="sub">Pick what you'd like to study.</div>
    <div class="list" id="setList"></div>
  </div>

  <div id="sessionScreen" class="card hidden">
    <div class="title">How much time do you have?</div>
    <div class="sub" id="sessionSub">Pick a session length.</div>
    <div class="list">
      <div class="list-item" data-size="7">
        <div class="list-icon">⚡</div>
        <div><div class="list-name">Quick</div><div class="list-meta">7 questions</div></div>
      </div>
      <div class="list-item" data-size="11">
        <div class="list-icon">⏱️</div>
        <div><div class="list-name">Medium</div><div class="list-meta">11 questions</div></div>
      </div>
      <div class="list-item" data-size="15">
        <div class="list-icon">🕒</div>
        <div><div class="list-name">Large</div><div class="list-meta">15 questions</div></div>
      </div>
    </div>
    <button class="back-link" id="sessionBack">← back to sets</button>
  </div>

  <div id="quizScreen" class="card quiz-card hidden">
    <div class="picture-slot" id="cardVisual"></div>
    <div class="prompt" id="promptText"></div>
    <div class="options" id="options"></div>
  </div>

  <div id="setCleared" class="card hidden">
    <div class="title">Set complete! 🎉</div>
    <div class="sub" id="clearedMeta">Nice work.</div>
    <button class="btn btn-primary" id="backToSets">Choose another set</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const cardVisual = document.getElementById('cardVisual');
  const promptText = document.getElementById('promptText');
  const options = document.getElementById('options');
  const toast = document.getElementById('toast');
  const selectScreen = document.getElementById('selectScreen');
  const setList = document.getElementById('setList');
  const sessionScreen = document.getElementById('sessionScreen');
  const sessionSub = document.getElementById('sessionSub');
  const sessionBack = document.getElementById('sessionBack');
  const quizScreen = document.getElementById('quizScreen');
  const setCleared = document.getElementById('setCleared');
  const clearedMeta = document.getElementById('clearedMeta');
  const backToSets = document.getElementById('backToSets');

  // ---- Supabase connection ----
  // Public anon key — safe to ship in client code (never put service_role here).
  const SUPABASE_URL = 'https://xaqkrjvrdgwyuptoyyfl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhcWtyanZyZGd3eXVwdG95eWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjM2NDIsImV4cCI6MjEwMTYzOTY0Mn0.WUejF1HXULU-KxuOltQf5TX3mTIoWkVk0AN2AFm5aaI';

  let sb = null;
  let sets = [];
  let currentSet = null; // { id, name, icon, exe_label }
  let queue = [];
  let activeRound = null;
  let clearedCards = [];

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.remove('show');
    void toast.offsetWidth;
    toast.classList.add('show');
  }

  connectSilently();

  async function connectSilently(){
    if(SUPABASE_URL.includes('PASTE_YOUR') || SUPABASE_ANON_KEY.includes('PASTE_YOUR')){
      selectScreen.innerHTML = '<div class="title">Setup needed</div><div class="setup-note">This copy of the app is missing its Supabase URL/key — edit the SUPABASE_URL and SUPABASE_ANON_KEY constants near the top of the script.</div>';
      selectScreen.classList.remove('hidden');
      return;
    }
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data, error } = await sb
        .from('sets')
        .select('id, name, icon, exe_label, cards(count)')
        .order('created_at');
      if(error) throw error;
      sets = data || [];
      renderSetList();
      selectScreen.classList.remove('hidden');
    } catch(err){
      console.error(err);
      selectScreen.innerHTML = '<div class="title">Couldn\'t load sets</div><div class="setup-note">Something went wrong reaching the database. Try again shortly.</div>';
      selectScreen.classList.remove('hidden');
    }
  }

  function renderSetList(){
    setList.innerHTML = '';
    sets.forEach(set=>{
      const count = set.cards && set.cards[0] ? set.cards[0].count : null;
      const item = document.createElement('div');
      item.className = 'list-item';
      item.innerHTML = `
        <div class="list-icon">${set.icon || '📚'}</div>
        <div>
          <div class="list-name">${set.name}</div>
          <div class="list-meta">${count === null ? '—' : count} words</div>
        </div>`;
      item.addEventListener('click', ()=> chooseSet(set));
      setList.appendChild(item);
    });
  }

  function chooseSet(set){
    currentSet = set;
    sessionSub.textContent = `Studying: ${set.name}`;
    selectScreen.classList.add('hidden');
    sessionScreen.classList.remove('hidden');
  }

  sessionScreen.querySelectorAll('.list-item').forEach(item=>{
    item.addEventListener('click', ()=> startGame(parseInt(item.dataset.size, 10)));
  });
  sessionBack.addEventListener('click', ()=>{
    sessionScreen.classList.add('hidden');
    selectScreen.classList.remove('hidden');
  });

  // ---- pronunciation (tap any word to hear it) ----
  let lastUtterance = null;
  let ttsUnlocked = false;

  function unlockTTS(){
    if(ttsUnlocked || !('speechSynthesis' in window)) return;
    ttsUnlocked = true;
    const primer = new SpeechSynthesisUtterance('');
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
  }
  document.addEventListener('pointerdown', unlockTTS, { once:true });

  function speakNow(text){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.92;
    u.onerror = ()=> showToast('Audio unavailable here');
    lastUtterance = u;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  function speakFallback(text){
    if(!('speechSynthesis' in window)){
      showToast('No recorded audio, and text-to-speech isn\'t supported here');
      return;
    }
    unlockTTS();
    const voices = window.speechSynthesis.getVoices();
    if(voices.length === 0){
      const onReady = ()=>{
        window.speechSynthesis.removeEventListener('voiceschanged', onReady);
        speakNow(text);
      };
      window.speechSynthesis.addEventListener('voiceschanged', onReady);
      setTimeout(()=> speakNow(text), 300);
    } else {
      speakNow(text);
    }
  }

  function playPronunciation(termCard){
    if(termCard.audio_url){
      const audio = new Audio(termCard.audio_url);
      audio.play().catch(()=> speakFallback(termCard.term));
    } else {
      speakFallback(termCard.term);
    }
  }
  function makeSpeakerBtn(termCard){
    const btn = document.createElement('span');
    btn.className = 'speak-btn';
    btn.textContent = '🔊';
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      playPronunciation(termCard);
    });
    return btn;
  }

  // ---- break big words into small pieces ----
  function chunkWord(term){
    return term.split(' ').map(w=>{
      if(w.length <= 5) return w;
      const parts = w.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi);
      return parts && parts.length > 1 ? parts.join('·') : w;
    }).join(' ');
  }

  function pickDistractorCards(allCards, excludeId, n){
    const pool = allCards.filter(c => c.id !== excludeId);
    return shuffle(pool).slice(0, n);
  }

  function sharesTag(a, b){
    if(!a.tags || !b.tags) return false;
    return a.tags.some(t => b.tags.includes(t));
  }

  function findOddOneOutGroup(pool){
    const shuffledPool = shuffle(pool);
    for(const anchor of shuffledPool){
      if(!anchor.tags || anchor.tags.length === 0) continue;
      const sameGroup = shuffledPool.filter(c => c.id !== anchor.id && sharesTag(anchor, c));
      if(sameGroup.length < 2) continue;
      const trio = [anchor, ...shuffle(sameGroup).slice(0,2)];
      const oddCandidates = shuffledPool.filter(c =>
        !trio.some(t => t.id === c.id) && !trio.some(t => sharesTag(t, c))
      );
      if(oddCandidates.length === 0) continue;
      const odd = shuffle(oddCandidates)[0];
      return { same: trio, odd };
    }
    return null;
  }

  function findConnectionsGroups(pool){
    const tagMap = {};
    pool.forEach(c=>{
      (c.tags||[]).forEach(t=>{
        if(!tagMap[t]) tagMap[t] = [];
        tagMap[t].push(c);
      });
    });
    const usedIds = new Set();
    const groups = [];
    const tagKeys = shuffle(Object.keys(tagMap));
    for(const tag of tagKeys){
      const candidates = tagMap[tag].filter(c => !usedIds.has(c.id));
      if(candidates.length >= 3){
        const chosen = shuffle(candidates).slice(0,3);
        chosen.forEach(c => usedIds.add(c.id));
        groups.push({ tag, cards: chosen });
        if(groups.length === 3) return groups;
      }
    }
    return null;
  }

  function buildQueue(allCards){
    let pool = shuffle(allCards);
    const rounds = [];

    if(pool.length >= 9){
      const groups = findConnectionsGroups(pool);
      if(groups){
        const usedIds = new Set(groups.flatMap(g => g.cards.map(c=>c.id)));
        rounds.push({ type:'connections', groups, allCards });
        pool = pool.filter(c => !usedIds.has(c.id));
      }
    }

    while(pool.length > 0){
      const remaining = pool.length;
      const roll = Math.random();

      if(remaining >= 4 && roll < 0.15){
        const found = findOddOneOutGroup(pool);
        if(found){
          const usedIds = new Set([...found.same, found.odd].map(c=>c.id));
          rounds.push({ type:'oddoneout', same: found.same, odd: found.odd, allCards });
          pool = pool.filter(c => !usedIds.has(c.id));
          continue;
        }
      }

      if(remaining >= 3 && roll < 0.30){
        rounds.push({ type:'match', cards: pool.slice(0,3), allCards });
        pool = pool.slice(3);
        continue;
      }

      const types = ['multiple','truefalse','type','dictationtype','dictationselect'];
      const type = types[Math.floor(Math.random()*types.length)];
      rounds.push({ type, card: pool[0], allCards });
      pool = pool.slice(1);
    }
    return rounds;
  }

  // Repeats cards (with a random single-card question type) to top a
  // session up to the target question count when the set's own material
  // ran out before we reached it.
  function padRounds(rounds, pool, targetSize, allCards){
    if(pool.length === 0) return rounds;
    while(rounds.length < targetSize){
      const card = pool[Math.floor(Math.random()*pool.length)];
      const type = SINGLE_CARD_TYPES[Math.floor(Math.random()*SINGLE_CARD_TYPES.length)];
      rounds.push({ type, card, allCards });
    }
    return rounds;
  }

  async function startGame(size){
    sessionScreen.classList.add('hidden');
    showToast('Loading…');
    // Fetch more cards than the question target — multi-card round types
    // (Match, Odd One Out, Connections) each turn several cards into a
    // single question, so we need headroom to still land on exactly
    // `size` questions after building the queue.
    const poolLimit = Math.min(size * 3, 60);
    let allCards;
    try{
      const { data, error } = await sb.rpc('get_random_cards', {
        p_set_id: currentSet.id,
        p_limit: poolLimit
      });
      if(error) throw error;
      allCards = data;
    } catch(err){
      console.error(err);
      const { data, error } = await sb.from('cards').select('*').eq('set_id', currentSet.id).limit(poolLimit);
      if(error){ showToast('Failed to load cards'); console.error(error); return; }
      allCards = data;
    }
    if(!allCards || allCards.length === 0){
      showToast('This set has no cards yet');
      selectScreen.classList.remove('hidden');
      return;
    }

    // Diagnostic: Odd One Out / Connections need multiple cards sharing the
    // exact same tag text. Log the distribution so it's easy to check why
    // those round types are or aren't appearing.
    const tagCounts = {};
    let taggedCardCount = 0;
    allCards.forEach(c=>{
      if(c.tags && c.tags.length){
        taggedCardCount++;
        c.tags.forEach(t=>{ tagCounts[t] = (tagCounts[t]||0) + 1; });
      }
    });
    console.log(`[vocab] ${taggedCardCount}/${allCards.length} fetched cards have tags. Tag counts:`, tagCounts);
    const bestTagCount = Math.max(0, ...Object.values(tagCounts));
    if(taggedCardCount === 0){
      showToast('Tip: add tags in the admin tool to unlock Odd One Out & Connections');
    } else if(bestTagCount < 3){
      console.log('[vocab] No tag currently covers 3+ cards in this session — Odd One Out needs 3, Connections needs three different tags each covering 3+.');
    }

    let rounds = buildQueue(allCards);
    if(rounds.length > size){
      rounds = rounds.slice(0, size);
    } else if(rounds.length < size){
      rounds = padRounds(rounds, allCards, size, allCards);
    }

    queue = rounds;
    clearedCards = [];
    setCleared.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    nextQuestion();
  }

  function nextQuestion(){
    if(clearedCards.length >= 3 && Math.random() < 0.2){
      const reviewCard = clearedCards[Math.floor(Math.random()*clearedCards.length)];
      const type = SINGLE_CARD_TYPES[Math.floor(Math.random()*SINGLE_CARD_TYPES.length)];
      showToast('Quick review!');
      startRound({ type, card: reviewCard, allCards: clearedCards, isReview:true });
      return;
    }
    if(queue.length === 0){
      clearedMeta.textContent = `${currentSet.name} — you got through all of it.`;
      quizScreen.classList.add('hidden');
      setCleared.classList.remove('hidden');
      return;
    }
    startRound(queue.shift());
  }

  function startRound(round){
    round.wrongCount = 0;
    activeRound = round;
    renderActiveRound();
  }

  const SINGLE_CARD_TYPES = ['multiple','truefalse','type','dictationtype','dictationselect'];
  const MULTI_CARD_TYPES = ['match','oddoneout','connections'];

  function renderActiveRound(){
    options.innerHTML = '';
    const round = activeRound;
    if(round.type === 'multiple') renderMultiple(round);
    else if(round.type === 'truefalse') renderTrueFalse(round);
    else if(round.type === 'type') renderType(round);
    else if(round.type === 'match') renderMatch(round);
    else if(round.type === 'oddoneout') renderOddOneOut(round);
    else if(round.type === 'connections') renderConnections(round);
    else if(round.type === 'dictationtype') renderDictationType(round);
    else if(round.type === 'dictationselect') renderDictationSelect(round);
  }

  function onCorrect(round){
    showToast('Correct! ✔');
    if(round && !round.isReview){
      let cleared;
      if(round.type === 'connections') cleared = round.groups.flatMap(g => g.cards);
      else if(round.type === 'oddoneout') cleared = [...round.same, round.odd];
      else cleared = round.cards || [round.card];
      cleared.forEach(c=>{
        if(!clearedCards.includes(c)) clearedCards.push(c);
      });
    }
    setTimeout(nextQuestion, 500);
  }

  function handleWrong(round){
    quizScreen.classList.remove('shake');
    void quizScreen.offsetWidth;
    quizScreen.classList.add('shake');

    round.wrongCount = (round.wrongCount || 0) + 1;

    if(!MULTI_CARD_TYPES.includes(round.type) && round.wrongCount >= 2){
      const otherTypes = SINGLE_CARD_TYPES.filter(t => t !== round.type);
      round.type = otherTypes[Math.floor(Math.random()*otherTypes.length)];
      round.wrongCount = 0;
      const hint = round.card.term.replace(/\s/g,'').length > 5
        ? ` — hint: ${chunkWord(round.card.term)}`
        : '';
      showToast(`Let's try a different way${hint}`);
      setTimeout(renderActiveRound, 400);
    } else {
      showToast('Not quite — try again');
    }
  }

  function setCardVisual(card){
    cardVisual.classList.remove('placeholder');
    cardVisual.style.display = '';
    if(card.image_url){
      cardVisual.innerHTML = `<img src="${card.image_url}" alt="">`;
    } else {
      cardVisual.classList.add('placeholder');
      cardVisual.textContent = '🖼️';
    }
  }

  function renderMultiple(round){
    const { card, allCards } = round;
    setCardVisual(card);
    promptText.innerHTML = `What is this?`;
    const distractors = pickDistractorCards(allCards, card.id, 2);
    shuffle([card, ...distractors]).forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'btn';
      const label = document.createElement('span');
      label.textContent = opt.term;
      btn.appendChild(label);
      btn.appendChild(makeSpeakerBtn(opt));
      btn.addEventListener('click', ()=>{
        opt.id === card.id ? onCorrect(round) : handleWrong(round);
      });
      options.appendChild(btn);
    });
  }

  function renderTrueFalse(round){
    const { card, allCards } = round;
    setCardVisual(card);
    const isTrue = Math.random() < 0.5;
    const shownCard = isTrue ? card : pickDistractorCards(allCards, card.id, 1)[0];
    promptText.innerHTML = `Is this <span class="target">"${shownCard.term}"</span>?`;
    promptText.appendChild(makeSpeakerBtn(shownCard));

    const wrap = document.createElement('div');
    wrap.className = 'btn-row';
    const yesBtn = document.createElement('button');
    yesBtn.className = 'btn btn-good';
    yesBtn.textContent = '✔ Correct';
    const noBtn = document.createElement('button');
    noBtn.className = 'btn btn-bad';
    noBtn.textContent = '✘ Incorrect';
    yesBtn.addEventListener('click', ()=> (isTrue ? onCorrect(round) : handleWrong(round)));
    noBtn.addEventListener('click', ()=> (!isTrue ? onCorrect(round) : handleWrong(round)));
    wrap.appendChild(yesBtn);
    wrap.appendChild(noBtn);
    options.appendChild(wrap);
  }

  function normalizeAnswer(str){
    return str
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/^(a|an|the)\s+/,'')
      .trim();
  }

  function renderType(round){
    const { card } = round;
    setCardVisual(card);
    promptText.innerHTML = `Type what this is`;
    buildTypeForm(round, card, ()=> playPronunciation(card), '🔊 Hear the word');
  }

  function buildTypeForm(round, card, onHear, hearLabel){
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '10px';

    if(onHear){
      const hearBtn = document.createElement('button');
      hearBtn.className = 'btn';
      hearBtn.style.justifyContent = 'center';
      hearBtn.textContent = hearLabel;
      hearBtn.addEventListener('click', onHear);
      wrap.appendChild(hearBtn);
    }

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'type-input';
    input.placeholder = 'Type your answer…';
    input.autocomplete = 'off';
    input.autocapitalize = 'off';
    input.spellcheck = false;

    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn btn-primary';
    submitBtn.textContent = 'Submit';

    function attempt(){
      const val = input.value.trim();
      if(!val) return;
      normalizeAnswer(val) === normalizeAnswer(card.term) ? onCorrect(round) : handleWrong(round);
    }
    submitBtn.addEventListener('click', attempt);
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attempt(); });

    wrap.appendChild(input);
    wrap.appendChild(submitBtn);
    options.appendChild(wrap);
    setTimeout(()=> input.focus(), 50);
  }

  function renderMatch(round){
    const cards = round.cards;
    cardVisual.style.display = 'none';
    promptText.innerHTML = `Match each picture to its word`;
    const leftItems = shuffle(cards.map(c=>({ key:c.id, card:c })));
    const rightItems = shuffle(cards.map(c=>({ key:c.id, card:c })));

    const grid = document.createElement('div');
    grid.className = 'match-grid';
    const leftCol = document.createElement('div');
    leftCol.className = 'match-col';
    const rightCol = document.createElement('div');
    rightCol.className = 'match-col';

    let selectedLeft = null;
    let matchedCount = 0;

    leftItems.forEach(item=>{
      const chip = document.createElement('button');
      chip.className = 'chip visual-chip';
      chip.innerHTML = item.card.image_url
        ? `<img src="${item.card.image_url}" alt="" style="width:40px;height:40px;object-fit:contain;">`
        : '🖼️';
      chip.dataset.key = item.key;
      chip.addEventListener('click', ()=>{
        if(chip.classList.contains('matched')) return;
        leftCol.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        selectedLeft = chip;
      });
      leftCol.appendChild(chip);
    });

    rightItems.forEach(item=>{
      const chip = document.createElement('button');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = item.card.term;
      chip.dataset.key = item.key;
      chip.appendChild(label);
      chip.appendChild(makeSpeakerBtn(item.card));
      chip.addEventListener('click', (e)=>{
        if(e.target.closest('.speak-btn')) return;
        if(chip.classList.contains('matched') || !selectedLeft) return;
        if(selectedLeft.dataset.key === chip.dataset.key){
          selectedLeft.classList.add('matched');
          chip.classList.add('matched');
          selectedLeft.classList.remove('selected');
          selectedLeft = null;
          matchedCount++;
          if(matchedCount === cards.length){
            setTimeout(()=> onCorrect(round), 300);
          }
        } else {
          chip.classList.add('shake-chip');
          selectedLeft.classList.add('shake-chip');
          showToast('Not a match');
          const badLeft = selectedLeft;
          setTimeout(()=>{
            chip.classList.remove('shake-chip');
            badLeft.classList.remove('shake-chip','selected');
          }, 350);
          selectedLeft = null;
        }
      });
      rightCol.appendChild(chip);
    });

    grid.appendChild(leftCol);
    grid.appendChild(rightCol);
    options.appendChild(grid);
  }

  function renderOddOneOut(round){
    cardVisual.style.display = 'none';
    promptText.innerHTML = `Which one doesn't belong?`;
    const four = shuffle([...round.same, round.odd]);

    const grid = document.createElement('div');
    grid.className = 'oddoneout-grid';
    four.forEach(card=>{
      const cell = document.createElement('button');
      cell.className = 'oo-cell';
      cell.innerHTML = `
        <div class="oo-img">${card.image_url ? `<img src="${card.image_url}" alt="">` : '🖼️'}</div>
        <div class="oo-label">${card.term}</div>`;
      cell.addEventListener('click', ()=>{
        card.id === round.odd.id ? onCorrect(round) : handleWrong(round);
      });
      grid.appendChild(cell);
    });
    options.appendChild(grid);
  }

  function renderConnections(round){
    cardVisual.style.display = 'none';
    promptText.innerHTML = `Group these into 3 sets of 3`;
    const groupColors = ['#e6f6ec', '#e8f0fe', '#fdeeea'];
    const allCells = shuffle(round.groups.flatMap((g, gi) => g.cards.map(c => ({ card:c, groupIndex:gi }))));

    let selected = [];
    let solvedGroups = 0;

    const grid = document.createElement('div');
    grid.className = 'connections-grid';

    allCells.forEach(item=>{
      const cell = document.createElement('button');
      cell.className = 'conn-cell';
      cell.innerHTML = `
        <div class="oo-img">${item.card.image_url ? `<img src="${item.card.image_url}" alt="">` : '🖼️'}</div>
        <div class="oo-label">${item.card.term}</div>`;
      cell.addEventListener('click', ()=>{
        if(cell.classList.contains('solved')) return;
        if(selected.includes(cell)){
          selected = selected.filter(c => c !== cell);
          cell.classList.remove('selected');
          return;
        }
        if(selected.length >= 3) return;
        selected.push(cell);
        cell.classList.add('selected');
        if(selected.length === 3){
          const groupIdxs = selected.map(c => c.dataset.groupIndex);
          const allSame = groupIdxs.every(g => g === groupIdxs[0]);
          if(allSame){
            const gi = parseInt(groupIdxs[0], 10);
            selected.forEach(c=>{
              c.classList.remove('selected');
              c.classList.add('solved');
              c.style.background = groupColors[gi % groupColors.length];
            });
            selected = [];
            solvedGroups++;
            showToast('Nice, that\'s a group!');
            if(solvedGroups === 3){
              setTimeout(()=> onCorrect(round), 300);
            }
          } else {
            showToast('Not a group');
            const toShake = [...selected];
            setTimeout(()=>{
              toShake.forEach(c=>{ c.classList.remove('selected'); c.classList.add('shake-chip'); });
              setTimeout(()=> toShake.forEach(c=> c.classList.remove('shake-chip')), 350);
            }, 250);
            selected = [];
          }
        }
      });
      cell.dataset.groupIndex = item.groupIndex;
      grid.appendChild(cell);
    });
    options.appendChild(grid);
  }

  function renderDictationType(round){
    const { card } = round;
    cardVisual.classList.remove('placeholder');
    cardVisual.innerHTML = '';
    cardVisual.classList.add('placeholder');
    cardVisual.style.display = '';
    cardVisual.textContent = '🔊';
    promptText.innerHTML = `Listen, then type what you hear`;
    playPronunciation(card);
    buildTypeForm(round, card, ()=> playPronunciation(card), '🔊 Play again');
  }

  function renderDictationSelect(round){
    const { card, allCards } = round;
    cardVisual.classList.remove('placeholder');
    cardVisual.innerHTML = '';
    cardVisual.classList.add('placeholder');
    cardVisual.style.display = '';
    cardVisual.textContent = '🔊';
    promptText.innerHTML = `Listen, then pick what you heard`;
    playPronunciation(card);

    const replayBtn = document.createElement('button');
    replayBtn.className = 'btn';
    replayBtn.style.justifyContent = 'center';
    replayBtn.style.marginBottom = '8px';
    replayBtn.textContent = '🔊 Play again';
    replayBtn.addEventListener('click', ()=> playPronunciation(card));
    options.appendChild(replayBtn);

    const distractors = pickDistractorCards(allCards, card.id, 2);
    shuffle([card, ...distractors]).forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.justifyContent = 'center';
      btn.textContent = opt.term;
      btn.addEventListener('click', ()=>{
        opt.id === card.id ? onCorrect(round) : handleWrong(round);
      });
      options.appendChild(btn);
    });
  }

  backToSets.addEventListener('click', ()=>{
    setCleared.classList.add('hidden');
    selectScreen.classList.remove('hidden');
  });
</script>

</body>
